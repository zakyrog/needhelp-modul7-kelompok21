<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Permintaan &amp; Penawaran Bantuan - NeedHelp</title>
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <script type="module" src="./assets/js/app.js"></script>
</head>
<body class="catalog-page">
  <!-- Header & Navigasi -->
  <header class="site-header">
    <a class="site-brand" href="index.html" aria-label="NeedHelp - Beranda">
      <img src="./assets/images/logo.svg" alt="NeedHelp" width="160" height="40">
    </a>
    <nav class="site-nav" aria-label="Navigasi Utama">
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="katalog.html" aria-current="page">Katalog</a></li>
        <li><a href="aktivitas.html">Aktivitas</a></li>
        <li><a href="chat.html">Pesan</a></li>
      </ul>
    </nav>
    <div class="header-right-actions">
      <form class="search-box-wrapper" action="katalog.html" method="get" role="search">
        <img src="./assets/images/icon-search.svg" alt="" class="search-icon" width="16" height="16">
        <input type="search" name="q" placeholder="Cari bantuan..." aria-label="Cari bantuan">
      </form>
      <a href="chat.html" class="icon-action-btn" aria-label="Pesan">
        <img src="./assets/images/icon-chat.svg" alt="" width="18" height="18">
      </a>
      <a href="notifikasi.html" class="icon-action-btn" aria-label="Notifikasi">
        <img src="./assets/images/icon-bell.svg" alt="" width="18" height="18">
      </a>
      <span class="user-profile-badge" role="img" aria-label="Profil pengguna">P</span>
    </div>
  </header>


  <main>
    <header>
      <h1>Feed Bantuan</h1>
      <p>Temukan orang di sekitar yang sedang membutuhkan bantuan.</p>

      <!-- Tombol Tab 2 Jalur & Opsi Urutkan -->
      <div class="catalog-actions-bar" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px;">
        <div style="display: flex; gap: 8px;">
          <a href="katalog.html?type=butuh" class="tab-btn" style="background: var(--color-bg-subtle, #e3fdfd); color: var(--color-action-primary, #4a9ba0); border: 1px solid var(--color-action-primary); padding: 6px 16px; border-radius: 999px; font-size: 12px; font-weight: 600; text-decoration: none;">Saya Butuh</a>
          <a href="katalog.html?type=bisa" class="tab-btn" style="background: var(--color-bg-surface, #ffffff); color: var(--color-text-muted, #5e7a80); border: 1px solid var(--color-border-default, #cfdadc); padding: 6px 16px; border-radius: 999px; font-size: 12px; font-weight: 600; text-decoration: none;">Saya Bisa</a>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-muted);">
          <label for="catalog-sort">Urutkan:</label>
          <select id="catalog-sort" data-catalog-sort style="padding: 4px 8px; border: 1px solid var(--color-border-default, #cfdadc); border-radius: 8px; background: var(--color-bg-surface, #ffffff); color: var(--color-text-primary); font-size: 12px; cursor: pointer;">
            <option value="terbaru">Terbaru</option>
            <option value="jadwal">Jadwal terdekat</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Bilah Samping Penyaring (Sidebar Filter) -->

    <!-- Bilah Samping Penyaring -->
    <aside aria-label="Penyaring Pencarian">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="margin: 0; font-size: 15px;">Filter</h2>
        <button
          type="button"
          data-filter-reset
          style="font-size: 12px; color: var(--color-action-primary); background: none; border: none; cursor: pointer;"
        >
          Bersihkan
        </button>
      </div>

      <form action="#" method="get" data-filter-form>
        <!-- Pencarian -->
        <div>
          <label for="catalog-search">Cari bantuan</label>
          <input
            type="search"
            id="catalog-search"
            name="q"
            placeholder="Cari judul atau deskripsi..."
          >
        </div>

        <!-- Jenis Postingan -->
        <fieldset>
          <legend>Jenis Postingan</legend>

          <p>
            <input type="radio" id="type-all" name="post_type" value="all" checked>
            <label for="type-all">Semua</label>
          </p>

          <p>
            <input type="radio" id="type-butuh" name="post_type" value="butuh">
            <label for="type-butuh">Saya Butuh</label>
          </p>

          <p>
            <input type="radio" id="type-bisa" name="post_type" value="bisa">
            <label for="type-bisa">Saya Bisa</label>
          </p>
        </fieldset>

        <!-- Kategori -->
        <fieldset>
          <legend>Kategori</legend>

          <p>
            <input type="checkbox" id="cat-ditemani" name="category" value="ditemani">
            <label for="cat-ditemani">Ditemani</label>
          </p>

          <p>
            <input type="checkbox" id="cat-bantuan" name="category" value="bantuan">
            <label for="cat-bantuan">Bantuan</label>
          </p>

          <p>
            <input type="checkbox" id="cat-pendampingan" name="category" value="pendampingan">
            <label for="cat-pendampingan">Pendampingan</label>
          </p>

          <p>
            <input type="checkbox" id="cat-explore" name="category" value="explore">
            <label for="cat-explore">Explore</label>
          </p>
        </fieldset>

        <!-- Lokasi -->
        <div>
          <label for="catalog-location">Lokasi</label>
          <select id="catalog-location" name="location">
            <option value="">Semua lokasi</option>
            <option value="sleman">Sleman</option>
            <option value="kota">Kota Yogyakarta</option>
            <option value="bantul">Bantul</option>
            <option value="kulonprogo">Kulon Progo</option>
            <option value="gunungkidul">Gunungkidul</option>
          </select>
        </div>

        <!-- Kompensasi -->
        <div>
          <label for="catalog-compensation">Sistem Kompensasi</label>
          <select id="catalog-compensation" name="compensation">
            <option value="">Semua kompensasi</option>
            <option value="tarif">Tarif Pasti</option>
            <option value="nego">Bisa Negosiasi</option>
            <option value="patungan">Patungan</option>
            <option value="traktir">Traktir</option>
            <option value="sukarela">Sukarela</option>
          </select>
        </div>

        <p>
          <button type="submit">Terapkan Filter</button>
        </p>
      </form>
    </aside>

    <!-- Daftar Postingan (Feed Cards) -->

    <section>
      <h2>Daftar Permintaan &amp; Penawaran Aktif</h2>

      <p data-catalog-count aria-live="polite"></p>

      <div data-catalog-list>
        <!-- Kartu akan dibuat otomatis oleh app.js dari data.js -->
      </div>

      <nav
        data-catalog-pagination
        aria-label="Navigasi Halaman Katalog"
      >
        <ol>
          <li><span aria-current="page">1</span></li>
        </ol>
      </nav>
    </section>

  </main>

  <!-- Kaki Halaman (Footer) -->
  <footer>
    <p>&copy; 2026 NeedHelp - Need-Based Companion &amp; Help.</p>
  </footer>
</body>
</html>
