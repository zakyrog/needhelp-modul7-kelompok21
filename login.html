<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — NeedHelp</title>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <script type="module" src="/assets/js/app.js"></script>
  </head>
  
  <body class="login-page">
    <main class="login-main">

      <aside class="login-banner">
        <div class="banner-content">
           <a href="index.html">
      <img src="./assets/images/logo.svg" alt="NeedHelp - Beranda" width="160" height="40">
    </a>
          <div class="quote-icon">“</div>
          <h1>Platform yang mempertemukan niat baik dengan kebutuhan nyata — di sekitarmu.</h1>
          
          <div class="banner-stats">
            <div class="stat-item">
              <h3>2.1k+</h3>
              <p>Permintaan dibantu</p>
            </div>
            <div class="stat-item">
              <h3>850+</h3>
              <p>Relawan aktif</p>
            </div>
            <div class="stat-item">
              <h3>4.8★</h3>
              <p>Rating komunitas</p>
            </div>
          </div>
        </div>

        <div class="banner-decorations">
          <div class="circle-large"></div>
          <div class="circle-small"></div>
        </div>
      </aside>

  
      <section class="login-card" aria-labelledby="login-title">
        <header>
          <h1 id="login-title">Selamat datang kembali 👋</h1>
          <p>Masuk untuk mulai meminta atau menawarkan bantuan.</p>
        </header>
        <p id="login-status" class="error-banner" role="alert" hidden></p>
        <form id="login-form" novalidate>
          <div class="fields">
            <div class="field">
              <label for="user-email">Email</label
              ><input
                id="user-email"
                name="email"
                type="email"
                autocomplete="username"
                placeholder="patungin@email.com"
              /><small id="email-error" class="field-error" hidden></small>
            </div>
            <div class="field">
              <label for="user-password">Password</label
              ><input
                id="user-password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••••"
              /><small id="password-error" class="field-error" hidden></small>
            </div>
          </div>
          <div class="meta-row">
            <label class="remember"
              ><input id="remember-me" type="checkbox" checked />Ingat
              saya</label
            ><button class="text-button" type="button" data-info="forgot">
              Lupa password?
            </button>
          </div>
          <button class="button button-primary" type="submit">Masuk</button>
          <div class="divider"><span>atau</span></div>
          <button
            class="button button-secondary"
            type="button"
            data-info="google"
          >
            Lanjutkan dengan Google
          </button>
          <p class="register">
            Belum punya akun?
            <button class="text-button" type="button" data-info="register">
              Daftar sekarang
            </button>
          </p>
        </form>
      </section>
    </main>
    <dialog id="info-modal" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <form method="dialog">
        <button class="button button-primary">Tutup</button>
      </form>
    </dialog>
  </body>
</html>
